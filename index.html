<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>مساعد الشحن | لوحة تحكم الأوردرات</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
<style>
:root{--bg:#f3f5fa;--card:#fff;--ink:#1b2437;--muted:#6b7690;--line:#e4e8f1;--pri:#2563eb;--pri2:#1e40af;
--green:#16a34a;--red:#dc2626;--amber:#d97706;--orange:#ea580c;--blue:#0284c7;--purple:#7c3aed;--gray:#6b7280}
*{box-sizing:border-box}
body{margin:0;font-family:Cairo,system-ui,sans-serif;background:var(--bg);color:var(--ink);line-height:1.6}
header{background:linear-gradient(135deg,var(--pri2),var(--pri));color:#fff;padding:14px 20px;display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:20;box-shadow:0 2px 12px #0002}
.brand{font-size:22px;font-weight:800;cursor:pointer}
.brand small{display:block;font-size:11px;font-weight:400;opacity:.8}
.actions{display:flex;gap:8px;flex-wrap:wrap}
.btn{border:0;border-radius:10px;padding:9px 16px;font:600 14px Cairo;cursor:pointer;background:#fff;color:var(--pri2);transition:.15s}
.btn:hover{transform:translateY(-1px);box-shadow:0 4px 12px #0003}
.btn.ghost{background:#ffffff26;color:#fff}
.btn.pri{background:var(--pri);color:#fff}
.wrap{max-width:1280px;margin:0 auto;padding:18px}
.drop{border:2.5px dashed #9db4e8;border-radius:20px;background:#fff;padding:50px 20px;text-align:center;margin-top:20px}
.drop.over{background:#eaf1ff;border-color:var(--pri)}
.drop h2{margin:8px 0}
.drop p{color:var(--muted);margin:6px 0}
.big{font-size:54px}
.hint{font-size:13px;color:var(--muted);max-width:640px;margin:14px auto 0;text-align:right;background:#f7f9fe;border-radius:12px;padding:12px 16px}
.filters{display:flex;flex-wrap:wrap;gap:10px;background:var(--card);padding:12px;border-radius:14px;border:1px solid var(--line);margin-bottom:14px;align-items:end}
.filters label{font-size:12px;color:var(--muted);display:block}
select,input[type=text],input[type=date]{font:14px Cairo;padding:7px 10px;border:1px solid var(--line);border-radius:8px;background:#fff;color:var(--ink);min-width:130px}
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px}
.tab{padding:9px 18px;border-radius:10px;background:#fff;border:1px solid var(--line);cursor:pointer;font-weight:600;color:var(--muted)}
.tab.on{background:var(--pri);color:#fff;border-color:var(--pri)}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px;margin-bottom:14px}
.kpi{background:var(--card);border-radius:14px;padding:14px 16px;border:1px solid var(--line);border-top:4px solid var(--c,var(--pri))}
